name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: node --test

  php:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        php: ["8.1", "8.4"]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: php php/tests/run.php
